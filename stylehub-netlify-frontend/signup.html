<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | StyleHub</title><link rel="stylesheet" href="style.css"><script defer src="config.js"></script><script defer src="app.js"></script></head><body data-page="signup"><header class="topbar"><a class="brand" href="index.html">StyleHub</a><nav><a href="index.html">Shop</a><a href="login.html">Login</a></nav></header><main class="auth-wrap"><section class="auth-card"><p class="eyebrow">JOIN STYLEHUB</p><h1>Create account</h1><p class="muted">A few details and you are ready to shop.</p><div id="message" aria-live="polite"></div><form id="signup-form" class="form-stack"><label>Full name<input name="fullName" required maxlength="100" autocomplete="name" placeholder="Your name"></label><label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label><button class="button full" type="submit">Create account</button></form><p class="form-foot">Already have an account? <a href="login.html">Log in</a></p></section></main></body></html>
